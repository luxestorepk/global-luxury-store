<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE | World-Class Luxury Footwear & AI Shopping</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --card-bg: #131317;
            --accent-gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #ffffff;
            --text-muted: #a0a0ab;
            --border-color: #222228;
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }
        .announcement-bar { background: linear-gradient(90deg, #d4af37, #f3e5ab, #d4af37); color: #000; text-align: center; padding: 9px; font-size: 13px; font-weight: 700; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background-color: rgba(19, 19, 23, 0.95); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 999; }
        .logo { font-size: 26px; font-weight: 800; letter-spacing: 2px; }
        .logo span { color: var(--accent-gold); }
        .nav-links { list-style: none; display: flex; gap: 30px; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 14px; }
        .cart-icon-btn { background: transparent; border: none; color: var(--text-main); font-size: 22px; cursor: pointer; position: relative; }
        .cart-count { background-color: var(--accent-gold); color: #000; font-size: 11px; font-weight: 800; border-radius: 50%; padding: 2px 6px; position: absolute; top: -8px; right: -10px; }
        .hero { display: flex; align-items: center; justify-content: space-between; padding: 70px 8%; min-height: 85vh; gap: 40px; }
        .hero-text { flex: 1; }
        .badge { display: inline-block; background: rgba(212, 175, 55, 0.1); color: var(--accent-gold); padding: 6px 16px; font-size: 12px; font-weight: 700; border-radius: 20px; border: 1px solid var(--accent-gold); margin-bottom: 20px; }
        .hero-text h1 { font-size: 54px; line-height: 1.15; margin-bottom: 20px; font-weight: 800; }
        .hero-text p { color: var(--text-muted); font-size: 17px; line-height: 1.6; margin-bottom: 35px; max-width: 520px; }
        .btn-group { display: flex; gap: 15px; }
        .btn { padding: 14px 30px; border-radius: var(--radius); font-weight: 700; text-decoration: none; cursor: pointer; font-size: 15px; border: none; }
        .btn-primary { background-color: var(--accent-gold); color: #000; }
        .btn-outline { background: transparent; color: #fff; border: 1px solid var(--border-color); }
        .hero-image { flex: 1; text-align: center; }
        .hero-image img { width: 100%; max-width: 480px; border-radius: 20px; }
        .trust-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 30px 8%; background-color: var(--card-bg); border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); text-align: center; }
        .trust-item { font-size: 14px; font-weight: 600; color: var(--text-muted); }
        .trust-item i { color: var(--accent-gold); margin-right: 8px; }
        .section-header { text-align: center; margin: 80px 0 40px; }
        .section-header h2 { font-size: 38px; margin-bottom: 10px; }
        .section-header p { color: var(--text-muted); }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; padding: 0 8% 80px; }
        .product-card { background-color: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border-color); padding: 20px; position: relative; }
        .product-tag { position: absolute; top: 15px; left: 15px; background: var(--accent-gold); color: #000; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 4px; }
        .product-card img { width: 100%; height: 240px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .product-card h3 { font-size: 18px; margin-bottom: 8px; }
        .stars { color: #ffca28; font-size: 13px; margin-bottom: 10px; }
        .price-box { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .price { font-size: 22px; font-weight: 800; color: var(--accent-gold); }
        .old-price { font-size: 14px; color: #666; text-decoration: line-through; }
        .add-btn { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--accent-gold); color: var(--accent-gold); border-radius: 8px; font-weight: 700; cursor: pointer; }
        .reviews-section { background-color: var(--card-bg); padding: 80px 8%; border-top: 1px solid var(--border-color); }
        .review-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 40px; }
        .review-card { background-color: var(--bg-dark); padding: 25px; border-radius: var(--radius); border: 1px solid var(--border-color); }
        .review-card p { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 15px; }
        .reviewer { font-weight: 700; font-size: 15px; }
        .reviewer span { font-size: 12px; color: var(--accent-gold); display: block; font-weight: 400; }
        .cart-drawer { position: fixed; top: 0; right: -400px; width: 380px; height: 100vh; background-color: var(--card-bg); border-left: 1px solid var(--border-color); z-index: 10000; transition: 0.4s ease; padding: 25px; display: flex; flex-direction: column; }
        .cart-drawer.active { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .close-cart { font-size: 24px; cursor: pointer; color: var(--text-muted); }
        .cart-items { flex: 1; overflow-y: auto; margin: 20px 0; }
        .cart-item { display: flex; gap: 15px; margin-bottom: 15px; background: var(--bg-dark); padding: 10px; border-radius: 8px; }
        .checkout-btn { width: 100%; padding: 15px; background: var(--accent-gold); border: none; color: #000; font-weight: 800; border-radius: 8px; cursor: pointer; }
        .ai-widget-btn { position: fixed !important; bottom: 30px !important; right: 30px !important; width: 60px; height: 60px; background: linear-gradient(135deg, #d4af37, #f3e5ab); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; cursor: pointer; box-shadow: 0 10px 25px rgba(212, 175, 55, 0.6); z-index: 99999 !important; }
        .chat-box { display: none; position: fixed !important; bottom: 100px !important; right: 30px !important; width: 340px; background-color: var(--card-bg); border: 1px solid var(--accent-gold); border-radius: var(--radius); box-shadow: 0 15px 40px rgba(0,0,0,0.9); z-index: 99999 !important; overflow: hidden; }
        .chat-header { background-color: #1a1a20; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .chat-header h4 { color: var(--accent-gold); font-size: 14px; }
        .chat-body { padding: 15px; height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg-bot { background: #1e1e24; color: #ddd; padding: 10px 12px; border-radius: 8px; border-left: 3px solid var(--accent-gold); font-size: 13px; }
        .msg-user { background: var(--accent-gold); color: #000; padding: 8px 12px; border-radius: 8px; align-self: flex-end; font-size: 13px; font-weight: 700; }
        .chat-footer { display: flex; border-top: 1px solid var(--border-color); }
        .chat-footer input { flex: 1; padding: 12px; background: var(--bg-dark); border: none; color: #fff; outline: none; font-size: 13px; }
        .chat-footer button { padding: 12px 18px; background: var(--accent-gold); border: none; color: #000; cursor: pointer; font-weight: 800; }
        footer { text-align: center; padding: 40px 8%; background-color: #060608; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 13px; }
        .payment-icons { font-size: 30px; display: flex; justify-content: center; gap: 20px; margin: 20px 0; color: #fff; }
    </style>
</head>
